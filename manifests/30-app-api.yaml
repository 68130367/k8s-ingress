apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-api
  labels: &labels
    app: app-api
    app.kubernetes.io/part-of: k8s-ingress-assignment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-api
  template:
    metadata:
      labels: *labels
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "-u", "/app/app.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
      volumes:
        - name: code
          configMap: { name: app-api-code }
---
apiVersion: v1
kind: Service
metadata:
  name: app-api
  labels:
    app.kubernetes.io/part-of: k8s-ingress-assignment
spec:
  type: ClusterIP
  selector:
    app: app-api
  ports:
    - port: 80
      targetPort: 8080
